# Golden-set source manifest. Rights checked from the linked publisher/repository
# pages on 2026-10-24. Source bytes are fetched into an ignored cache, not Git.
manifest_version: 1
reuse_policy:
  preferred_license: CC-BY-4.0
  attribution_required: true
  note: >-
    Golden content may be used in a commercial school product and sent to the
    configured model for inference. Use only the listed licensed text and
    exclude separately licensed images or ancillary material.
  openstax_excluded_because: >-
    OpenStax's current textbooks generally use CC BY-NC-SA; its Biology 2e
    pages also prohibit use in generative-AI offerings without prior written
    permission. Do not add OpenStax content without permission and a recorded
    licence review.
  openstax_license_evidence: https://help.openstax.org/s/article/Licensing-information-of-OpenStax-textbooks
  openstax_ai_use_evidence: https://openstax.org/books/biology-2e/pages/2-introduction

sources:
