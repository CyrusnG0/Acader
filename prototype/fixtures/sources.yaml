    kind: peer_reviewed_article
    role: nursing / clinical evidence
    title: Impact of having a certified nurse specialist in critical care nursing as head nurse on ICU patient outcomes
    authors: [Tomohide Fukuda, Hironori Sakurai, Masanori Kashiwagi]
    citation: "Fukuda T, Sakurai H, Kashiwagi M (2020). PLoS ONE 15(2): e0228458."
    version: published_2020
    doi: 10.1371/journal.pone.0228458
    content_url: https://journals.plos.org/plosone/article/file?id=10.1371/journal.pone.0228458&type=printable
    landing_page: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0228458
    license: CC-BY-4.0
    license_evidence: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0228458
    license_scope: article text; exclude any separately credited third-party content
    existing_parser_fixture: ../spikes/S2/corpus.json#nursing
    use: >-
      Nursing reading with clear methods, before/after comparison, outcomes and
      limits on generalisation; reuses the S2 parser source.

