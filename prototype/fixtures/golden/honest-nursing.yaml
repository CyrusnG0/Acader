# Golden session (T-015). Simulated: the student text is invented test text, not student data.
schema_version: 1
session_id: honest-nursing
split: tuning
label_status: draft_needs_second_person_review
scenario: >-
  The nursing case (CEO-15), honest writer: reads the results and the limitation,
  anchors two cards, revises a claim after the limitation pin, sets a source aside
  with a reason, quotes the paper twice, answers a Coach question and moves the
  answer into the draft, and ends with one unlinked typed sentence.
source_ids: [nursing, socsci]
claims:
  - {claim_id: c1, text: "A CNS head nurse was associated with lower ICU mortality in one ICU."}
  - {claim_id: c2, text: "The findings may not generalize beyond this hospital."}

actions:
  - {minute: 0, action: open_source, source_id: nursing}
  - {minute: 1, action: view_blocks, source_id: nursing, block_ids: [nursing.p1.abstract-results, nursing.p2.design, nursing.p7.limitation]}
  - {minute: 2, action: open_pin, source_id: nursing, block_id: nursing.p7.limitation, pin_kind: limitation}
  - minute: 3
    action: create_card
    card_id: card1
    text: "Mortality fell after the CNS appointment (OR 0.52)."
    anchor: {source_id: nursing, block_ref: nursing.p1.abstract-results, quote: "associated with lower ICU mortality"}
  - minute: 4
    action: create_card
    card_id: card2
    text: "Single institution, so hard to generalize."
    anchor: {source_id: nursing, block_ref: nursing.p7.limitation, quote: "based in a single institution"}
  - {minute: 5, action: create_claim, claim_id: c1, card_ids: [card1]}
  - {minute: 5, action: create_claim, claim_id: c2, card_ids: []}
  - {minute: 6, action: edit_claim, claim_id: c2, card_ids: [card2]}
  - {minute: 7, action: open_source, source_id: socsci}
  - {minute: 8, action: set_aside, source_id: socsci, reason_tag: "off topic", note: "Sanitation, not nursing."}
  - {minute: 10, action: type_paragraph, paragraph_id: p1, text: "Fukuda and colleagues report that a CNS head nurse was "}
  - minute: 10
    action: insert
    paragraph_id: p1
    runs: [{text: "associated with lower ICU mortality", kind: quote, ref: nursing.p1.abstract-results}]
  - {minute: 11, action: type, paragraph_id: p1, text: " in their ICU. This result is the core of my argument."}
  - {minute: 11, action: link, paragraph_id: p1, claim_id: c1, by: student}
  - {minute: 12, action: checkpoint}
  - {minute: 15, action: type_paragraph, paragraph_id: p2, text: "The authors note that it was "}
  - minute: 15
    action: insert
    paragraph_id: p2
    runs: [{text: "based in a single institution", kind: quote, ref: nursing.p7.limitation}]
  - {minute: 16, action: type, paragraph_id: p2, text: ", so other hospitals may differ."}
  - {minute: 16, action: link, paragraph_id: p2, claim_id: c2, by: student}
  - minute: 18
    action: coach_ask
    q_id: q1
    case: B
    pillar: logic
    grounding_ids: [c2, nursing.p7.limitation]
    question: "What would a second hospital need to share with this ICU for the result to carry over?"
  - minute: 19
    action: coach_outcome
    q_id: q1
    outcome: revised
    parts: [{text: "It would need a similar open ICU without intensivists running care.", kind: typed}]
  - minute: 20
    action: insert
    paragraph_id: p3
    runs: [{text: "It would need a similar open ICU without intensivists running care.", kind: coach, ref: q1}]
  - {minute: 20, action: link, paragraph_id: p3, claim_id: c2, by: coach}
  - {minute: 21, action: checkpoint}
  - {minute: 25, action: type_paragraph, paragraph_id: p4, text: "Staffing decisions should weigh this evidence with care.", keys: true}
  - {minute: 26, action: submit}

batches:
  - batch_id: b10
    window_start_minute: 10
    changed_paragraph_ids: [p1]
    expected_links: [{paragraph_id: p1, claim_id: c1}]
  - batch_id: b15
    window_start_minute: 15
    changed_paragraph_ids: [p2]
    expected_links: [{paragraph_id: p2, claim_id: c2}]
  - batch_id: b20
    window_start_minute: 20
    changed_paragraph_ids: [p3]
    expected_links: [{paragraph_id: p3, claim_id: c2}]
  - batch_id: b25
    window_start_minute: 25
    changed_paragraph_ids: [p4]
    expected_links: []

# Why these numbers (T-015 handoff has the full reasoning):
# p1 s1 holds a checked quote and nothing pasted -> traced_source (18 words, 5 quoted words);
#    s2 is typed elaboration in a student-linked paragraph -> student_linked (8).
# p2 s3 holds a checked quote -> traced_source (16; "institution," ends with a typed comma,
#    so 4 quoted words). p3 s4 is the student's own typed Coach answer -> traced_coach (11);
#    its link is by coach, so it is not a student_link target. p4 is unlinked typed -> untraced (8).
# Units: c1 = 18 ts + 8 sl -> traced_source; c2 = 16 ts + 11 tc -> traced_source; p4 untraced.
# Moments: claim c2 edited after the limitation pin and its anchor; socsci set aside with a
# reason; Coach q1 revised.
expected_receipt:
  status: complete
  mechanics_words: 0
  total_words: 61
  bands_by_words: {declared: 0, traced_source: 34, traced_coach: 11, student_linked: 8, untraced: 8}
  bands_by_claims: {declared: 0, traced_source: 2, traced_coach: 0, student_linked: 0, untraced: 1}
  quoted_words: 9
  inferred_links: 0
  map_suggestions: 0
  sentences:
    p1: ["traced_source 18", "student_linked 8"]
    p2: ["traced_source 16"]
    p3: ["traced_coach 11"]
    p4: ["untraced 8"]
  claim_units: {c1: traced_source, c2: traced_source, p4: untraced}
  notes: {label_not_confirmed: 0, pasted_linked_not_checked: 0}
  unconfirmed_marks: []
  moments:
    - {kind: claim_edit_after_limitation, claim_id: c2, source_id: nursing}
    - {kind: set_aside, source_id: socsci, reason_tag: "off topic"}
    - {kind: coach_revised, q_id: q1}
  question_targets: ["s1 p1 student_link", "s2 p1 student_link", "s3 p2 student_link", "s5 p4 unlinked"]
  facts: {editor_pastes: 0, paste_surviving_chars: 0, cards_with_paste: 0, coach_answers_with_paste: 0,
          declared_claims: 0, declared_claims_anchored: 0}

# Expected compiled question targets authored from the scenario and receipt rules.
expected_compiled_receipt:
  status: complete
  questions_pending: false
  mechanics: 0
  question_targets:
    - {paragraph_id: p4, why: untraced_claim, grounding: [c1]}
