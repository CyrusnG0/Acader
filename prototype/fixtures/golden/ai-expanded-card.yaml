# Golden session (T-015). Simulated: the student text and the pasted expansion are invented test text.
schema_version: 1
session_id: ai-expanded-card
split: tuning
label_status: draft_needs_second_person_review
scenario: >-
  The student types a short card note, then pastes an outside expansion into the
  card. The card is mostly pasted, so its chain breaks. The student moves the
  card into the draft (its pasted part stays paste_ext, D26), adds a typed
  sentence, and writes a second, fully typed paragraph on the same claim.
source_ids: [nursing]
claims:
  - {claim_id: c1, text: "CNS-led conferences show clinical leadership in the ICU."}

actions:
  - {minute: 0, action: open_source, source_id: nursing}
  - minute: 2
    action: create_card
    card_id: card1
    parts:
      - {text: "CNS leads conferences", kind: typed}
      - {text: " that bring physicians, nurses and therapists together to set shared goals for long-stay patients.", kind: paste_ext}
  - {minute: 3, action: create_claim, claim_id: c1, card_ids: [card1]}
  - minute: 5
    action: insert
    paragraph_id: p1
    runs:
      - {text: "CNS leads conferences", kind: typed, ref: null}
      - {text: " that bring physicians, nurses and therapists together to set shared goals for long-stay patients.", kind: paste_ext, ref: card1-paste}
  - {minute: 5, action: link, paragraph_id: p1, claim_id: c1, by: student}
  - {minute: 6, action: type, paragraph_id: p1, text: " This shows leadership in practice."}
  - {minute: 10, action: type_paragraph, paragraph_id: p2, text: "The conferences also gave nurses a voice in ethical cases."}
  - {minute: 10, action: link, paragraph_id: p2, claim_id: c1, by: student}
  - {minute: 11, action: submit}

batches:
  - batch_id: b5
    window_start_minute: 5
    changed_paragraph_ids: [p1]
    expected_links: [{paragraph_id: p1, claim_id: c1}]
  - batch_id: b10
    window_start_minute: 10
    changed_paragraph_ids: [p2]
    expected_links: [{paragraph_id: p2, claim_id: c1}]

# Why these numbers:
# s1 = 21 typed + 98 paste_ext characters (82% pasted) in a linked paragraph -> untraced with the
#    D13 note, 17 words. s2 (5) and s3 (10) are typed in linked paragraphs -> student_linked.
# Unit c1: 15 student_linked vs 17 untraced -> untraced.
# Facts: the card is >= 50% pasted (cards_with_paste 1). The move into the draft is not an editor
#    paste event, so editor_pastes stays 0.
expected_receipt:
  status: complete
  mechanics_words: 0
  total_words: 32
  bands_by_words: {declared: 0, traced_source: 0, traced_coach: 0, student_linked: 15, untraced: 17}
  bands_by_claims: {declared: 0, traced_source: 0, traced_coach: 0, student_linked: 0, untraced: 1}
  quoted_words: 0
  inferred_links: 0
  map_suggestions: 0
  sentences:
    p1: ["untraced 17", "student_linked 5"]
    p2: ["student_linked 10"]
  claim_units: {c1: untraced}
  notes: {label_not_confirmed: 0, pasted_linked_not_checked: 1}
  unconfirmed_marks: []
  moments: []
  question_targets: ["s1 p1 pasted,student_link", "s2 p1 student_link", "s3 p2 student_link"]
  facts: {editor_pastes: 0, paste_surviving_chars: 0, cards_with_paste: 1, coach_answers_with_paste: 0,
          declared_claims: 0, declared_claims_anchored: 0}

# Expected compiled question targets authored from the scenario and receipt rules.
expected_compiled_receipt:
  status: complete
  questions_pending: false
  mechanics: 0
  question_targets:
    - {paragraph_id: p1, why: untraced_claim, grounding: [c1]}
