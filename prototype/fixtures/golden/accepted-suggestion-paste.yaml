# Golden session (T-015). Simulated: the pasted text and the student text are invented test text.
schema_version: 1
session_id: accepted-suggestion-paste
split: tuning
label_status: draft_needs_second_person_review
mapper_enabled: true
scenario: >-
  Eng v2 D12/D13: the student pastes an outside paragraph; the mapper suggests
  linking it to the student's claim; the student accepts. The accepted link
  carries the suggestion_id and is counted in the sub-count, but the pasted
  sentences stay untraced with the D13 note. A typed paragraph the student
  links by hand is band 4.
source_ids: [socsci]
claims:
  - {claim_id: c1, text: "The sanitation policy increased river contamination."}

actions:
  - {minute: 0, action: open_source, source_id: socsci}
  - minute: 1
    action: create_card
    card_id: card1
    text: "Fecal contamination of rivers rose 72% under the policy."
    anchor: {source_id: socsci, block_ref: socsci.p1.abstract, quote: "increases fecal contamination of rivers by 72%"}
  - {minute: 2, action: create_claim, claim_id: c1, card_ids: [card1]}
  - minute: 5
    action: paste
    paragraph_id: p1
    text: "Sanitation subsidies can backfire when sludge has nowhere safe to go. Rivers downstream of new latrines become more contaminated over time."
  - {minute: 6, action: type_paragraph, paragraph_id: p2, text: "The paper finds river contamination rose by 72% under the policy."}
  - {minute: 6, action: link, paragraph_id: p2, claim_id: c1, by: student}
  - {minute: 10, action: map_suggestion, suggestion_id: sg1, paragraph_id: p1, claim_id: c1}
  - {minute: 11, action: map_answer, suggestion_id: sg1, answer: "yes"}
  - {minute: 11, action: accept_suggestion, paragraph_id: p1, claim_id: c1, suggestion_id: sg1}
  - {minute: 12, action: submit}

batches:
  - batch_id: b5
    window_start_minute: 5
    changed_paragraph_ids: [p1, p2]
    expected_links:
      - {paragraph_id: p1, claim_id: c1}
      - {paragraph_id: p2, claim_id: c1}

# Why these numbers:
# p1: both sentences are 100% paste_ext; the accepted suggestion link is a student link with a
#    suggestion_id, which never lifts a pasted sentence (D13, D19) -> untraced with the note, 11 + 10.
# p2 typed, linked by hand -> student_linked 11. Unit c1: 21 untraced vs 11 -> untraced.
# Sub-counts: inferred_links 1 (p1's link carries sg1), map_suggestions 1. Paste: 69 + 1 + 69 = 139.
expected_receipt:
  status: complete
  total_words: 32
  bands_by_words: {declared: 0, traced_source: 0, traced_coach: 0, student_linked: 11, untraced: 21}
  bands_by_claims: {declared: 0, traced_source: 0, traced_coach: 0, student_linked: 0, untraced: 1}
  quoted_words: 0
  inferred_links: 1
  map_suggestions: 1
  sentences:
    p1: ["untraced 11", "untraced 10"]
    p2: ["student_linked 11"]
  claim_units: {c1: untraced}
  notes: {label_not_confirmed: 0, pasted_linked_not_checked: 2}
  unconfirmed_marks: []
  moments: []
  question_targets: ["s1 p1 pasted,student_link", "s2 p1 pasted,student_link", "s3 p2 student_link"]
  facts: {editor_pastes: 1, paste_surviving_chars: 139, cards_with_paste: 0, coach_answers_with_paste: 0,
          declared_claims: 0, declared_claims_anchored: 0}
