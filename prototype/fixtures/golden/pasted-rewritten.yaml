# Golden session (T-015). Simulated: the pasted "outside" text and the student text are invented test text.
schema_version: 1
session_id: pasted-rewritten
split: tuning
label_status: draft_needs_second_person_review
scenario: >-
  The student pastes a three-sentence paragraph from outside the platform, links
  it to their own anchored claim, rewrites the middle sentence completely and
  three words of the last one by hand.
source_ids: [nursing]
claims:
  - {claim_id: c1, text: "Specialist head nurses connect doctors and bedside nurses."}

actions:
  - {minute: 0, action: open_source, source_id: nursing}
  - minute: 1
    action: create_card
    card_id: card1
    text: "A CNS head nurse links physicians, intensivists and ICU nurses."
    anchor: {source_id: nursing, block_ref: nursing.p6.head-nurse-role, quote: "communicated nursing policies while exchanging information with doctors"}
  - {minute: 2, action: create_claim, claim_id: c1, card_ids: [card1]}
  - minute: 5
    action: paste
    paragraph_id: p1
    text: "Hospitals that appoint specialist nurses as unit leaders often see better patient results. These leaders bridge the gap between doctors and bedside staff. Their clinical judgment shapes daily decisions in the unit."
  - {minute: 5, action: link, paragraph_id: p1, claim_id: c1, by: student}
  - {minute: 6, action: checkpoint}
  - minute: 10
    action: replace
    paragraph_id: p1
    find: "These leaders bridge the gap between doctors and bedside staff."
    text: "In my view, head nurses who are also specialists can translate between intensivists and the nurses at the bedside."
  - {minute: 11, action: replace, paragraph_id: p1, find: "shapes daily decisions", text: "guides the plans", keys: true}
  - {minute: 12, action: submit}

batches:
  - batch_id: b5
    window_start_minute: 5
    changed_paragraph_ids: [p1]
    expected_links: [{paragraph_id: p1, claim_id: c1}]

# Why these numbers:
# s1 is still 100% pasted in a linked paragraph -> untraced, note "pasted; linked by the student,
#    not checked" (D13), 13 words. s2 was retyped entirely -> student_linked 19.
# s3 keeps 37 of 53 characters pasted (70% >= 50%) -> untraced with the same note, 9 words.
# Unit c1: 19 student_linked vs 22 untraced -> untraced.
# Paste fact: 214 pasted chars, minus the replaced sentence (63) and "shapes daily decisions" (22),
#    plus 1: the old and new sentence 2 both end in ".", and the browser's DOM diff keeps that
#    unchanged character with its paste_ext mark (found on the first run; see the T-015 handoff,
#    PD-T015-2). s2 then has 1 pasted character of 114, which does not change its band = 130.
expected_receipt:
  status: complete
  mechanics_words: 0
  total_words: 41
  bands_by_words: {declared: 0, traced_source: 0, traced_coach: 0, student_linked: 19, untraced: 22}
  bands_by_claims: {declared: 0, traced_source: 0, traced_coach: 0, student_linked: 0, untraced: 1}
  quoted_words: 0
  inferred_links: 0
  map_suggestions: 0
  sentences:
    p1: ["untraced 13", "student_linked 19", "untraced 9"]
  claim_units: {c1: untraced}
  notes: {label_not_confirmed: 0, pasted_linked_not_checked: 2}
  unconfirmed_marks: []
  moments: []
  question_targets: ["s1 p1 pasted,student_link", "s2 p1 student_link", "s3 p1 pasted,student_link"]
  facts: {editor_pastes: 1, paste_surviving_chars: 130, cards_with_paste: 0, coach_answers_with_paste: 0,
          declared_claims: 0, declared_claims_anchored: 0}

# Expected compiled question targets authored from the scenario and receipt rules.
expected_compiled_receipt:
  status: complete
  questions_pending: false
  mechanics: 0
  question_targets:
    - {paragraph_id: p1, why: untraced_claim, grounding: [c1]}
