# Golden session (T-015). Simulated: the student text is invented test text.
schema_version: 1
session_id: edit-above-linked
split: tuning
label_status: draft_needs_second_person_review
scenario: >-
  D17/D-045: an honest writer links a paragraph containing a checked source
  quote, then adds text to the paragraph above it. The downstream positions
  move while the paragraph link, quote mark and source chain stay intact.
source_ids: [nursing]
claims:
  - {claim_id: c1, text: "The single institution limits generalization."}

actions:
  - {minute: 0, action: open_source, source_id: nursing}
  - minute: 1
    action: create_card
    card_id: card1
    text: "Single institution limits generalization."
    anchor: {source_id: nursing, block_ref: nursing.p7.limitation, quote: "based in a single institution"}
  - {minute: 2, action: create_claim, claim_id: c1, card_ids: [card1]}
  - {minute: 5, action: type_paragraph, paragraph_id: p1, text: "This paragraph introduces the nursing question."}
  - {minute: 6, action: type_paragraph, paragraph_id: p2, text: "The study was "}
  - minute: 6
    action: insert
    paragraph_id: p2
    runs: [{text: "based in a single institution", kind: quote, ref: nursing.p7.limitation}]
  - {minute: 6, action: type, paragraph_id: p2, text: " and limits generalization."}
  - {minute: 6, action: link, paragraph_id: p2, claim_id: c1, by: student}
  - {minute: 7, action: checkpoint}
  - {minute: 10, action: type, paragraph_id: p1, text: " It now includes more context before the evidence."}
  - {minute: 11, action: checkpoint}
  - {minute: 12, action: submit}

batches:
  - batch_id: b5
    window_start_minute: 5
    changed_paragraph_ids: [p1, p2]
    expected_links: [{paragraph_id: p2, claim_id: c1}]
  - batch_id: b10
    window_start_minute: 10
    changed_paragraph_ids: [p1]
    expected_links: []

# p1 contains two unlinked typed sentences (6 + 8 words). The 11-word p2
# contains a confirmed five-word source quote and remains linked to c1 after
# the earlier paragraph grows. Its source chain is unchanged by that shift.
expected_receipt:
  status: complete
  mechanics_words: 0
  total_words: 25
  bands_by_words: {declared: 0, traced_source: 11, traced_coach: 0, student_linked: 0, untraced: 14}
  bands_by_claims: {declared: 0, traced_source: 1, traced_coach: 0, student_linked: 0, untraced: 1}
  quoted_words: 5
  inferred_links: 0
  map_suggestions: 0
  sentences:
    p1: ["untraced 6", "untraced 8"]
    p2: ["traced_source 11"]
  claim_units: {p1: untraced, c1: traced_source}
  notes: {label_not_confirmed: 0, pasted_linked_not_checked: 0}
  unconfirmed_marks: []
  moments: []
  question_targets: ["s1 p1 unlinked", "s2 p1 unlinked", "s3 p2 student_link"]
  facts: {editor_pastes: 0, paste_surviving_chars: 0, cards_with_paste: 0, coach_answers_with_paste: 0,
          declared_claims: 0, declared_claims_anchored: 0}

# Expected compiled question targets authored from the scenario and receipt rules.
expected_compiled_receipt:
  status: complete
  questions_pending: false
  mechanics: 0
  question_targets:
    - {paragraph_id: p1, why: untraced_claim, grounding: [c1]}
