[project]
name = "writing-room-prototype"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic", "httpx", "python-dotenv", "prosemirror==0.6.1"]

[project.optional-dependencies]
dev = ["pytest", "pyyaml"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server", ".."]
