# One machine only: sessions live on its disk and the daily call limit lives in its memory.
app = "acader-room"
primary_region = "hkg"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "30s"
  timeout = "5s"

[env]
  DAILY_CALL_CAP = "3000"
  SESSION_CALL_CAP = "260"
  IP_SESSIONS_PER_HOUR = "8"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
