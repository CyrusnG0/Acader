<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing Room Walkthrough</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2330; --muted:#566074; --line:#d9d4c7;
  --accent:#2f4ea2; --accent-ink:#ffffff; --accent-soft:#e6ecfb;
  --ok:#17663a; --ok-soft:#e1f3e8; --warn:#8a5200; --warn-soft:#fdf0d6;
  --bad:#9b2335; --bad-soft:#fbe4e8; --info-soft:#eef1f7;
  --vague:#6b3fa0; --vague-soft:#f1e8fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --card:#1a1f2a; --ink:#e8ebf2; --muted:#a2abbd; --line:#323a4a;
  --accent:#8aa6ff; --accent-ink:#10162b; --accent-soft:#222c4d;
  --ok:#6fd49a; --ok-soft:#173326; --warn:#f0b960; --warn-soft:#3a2b10;
  --bad:#ff93a3; --bad-soft:#3c1b22; --info-soft:#1f2531; --vague:#cfaaff; --vague-soft:#2c2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --card:#1a1f2a; --ink:#e8ebf2; --muted:#a2abbd; --line:#323a4a;
  --accent:#8aa6ff; --accent-ink:#10162b; --accent-soft:#222c4d;
  --ok:#6fd49a; --ok-soft:#173326; --warn:#f0b960; --warn-soft:#3a2b10;
  --bad:#ff93a3; --bad-soft:#3c1b22; --info-soft:#1f2531; --vague:#cfaaff; --vague-soft:#2c2140; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:18px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;padding-inline:16px;padding-block:0 130px}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
h2{font-size:1.7rem}
h3{font-size:1.1rem}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
.top .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:1.05rem}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:44px;padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;font-size:.9rem}
.pill[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}

/* page body */
main{display:flex;flex-direction:column;gap:28px;padding-block:28px}
.head{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:.85rem;font-weight:600;background:var(--info-soft);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.box.say{border-left:6px solid var(--accent);background:var(--accent-soft)}
.box.say h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.box.say p{font-size:1.15rem}
.look{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.screen-label{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.screen{border:2px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:20px;background:var(--bg)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px}
@media (max-width:780px){.cols{grid-template-columns:minmax(0,1fr)}.cols>.col:last-child{order:-1}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.src{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.src .cite{font-size:.9rem;color:var(--muted)}
.src blockquote{margin:0;padding-left:12px;border-left:3px solid var(--line);font-size:.95rem}
.src .method{font-size:.88rem;background:var(--info-soft);padding:8px 10px;border-radius:8px}
.badge{align-self:flex-start;display:inline-flex;gap:6px;padding:3px 12px;border-radius:999px;font-size:.85rem;font-weight:700;border:1px solid var(--line)}
.badge.used{background:var(--ok-soft);color:var(--ok)}
.badge.gap{background:var(--warn-soft);color:var(--warn)}
.badge.aside{background:var(--bad-soft);color:var(--bad)}
.badge.open{background:var(--info-soft);color:var(--muted)}
.aside-box{border:2px dashed var(--line);border-radius:10px;padding:14px;font-size:.95rem;display:flex;flex-direction:column;gap:6px}
.essay{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px}
.para{display:flex;flex-direction:column;gap:4px}
.para .pl{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.para.empty p{color:var(--muted);font-style:italic}
del{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px;padding:0 3px;border-radius:3px}
ins{background:var(--ok-soft);color:var(--ok);text-decoration:underline;text-underline-offset:3px;padding:0 3px;border-radius:3px}
.legend{font-size:.85rem;color:var(--muted)}
.fresh{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}
.fresh-tag{align-self:flex-start;font-size:.75rem;font-weight:700;background:var(--accent);color:var(--accent-ink);padding:1px 9px;border-radius:999px}
.banner{border:2px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:12px 14px;display:flex;gap:10px}
.banner b{color:var(--warn)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.log li{border-left:4px solid var(--line);padding:2px 0 2px 12px;font-size:.95rem}
.log li.new{border-left-color:var(--accent)}
.log code{font:600 .85rem ui-monospace,Menlo,monospace;color:var(--accent)}
.coach{display:flex;flex-direction:column;gap:6px}
.same{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:680px){.same{grid-template-columns:minmax(0,1fr)}}
.same>div{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.same .a{background:var(--bad-soft)}
.same .b{background:var(--ok-soft)}
.profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.profile li{background:var(--info-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.profile b{display:block;font-size:1.3rem}
.qs{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:12px}
.btn{min-height:44px;padding:8px 18px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.words div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.words b{display:block;margin-bottom:2px}
.note-line{font-size:.9rem;color:var(--muted)}
.big{font-size:1.2rem}

/* git status, brainstorm, wording, skills */
.git{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.git h3{font:700 1rem ui-monospace,Menlo,monospace}
.git ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.git li{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.95rem;align-items:baseline}
.git .k{font:700 .85rem ui-monospace,Menlo,monospace;min-width:7.5em}
.git .w{font:600 .85rem ui-monospace,Menlo,monospace;color:var(--muted);min-width:5em}
.git .d{min-width:0;flex:1 1 12em}
.k.new,.k.linked,.k.saved{color:var(--ok)}
.k.modified{color:var(--accent)}
.k.replaced,.k.pasted,.k.aside{color:var(--warn)}
.k.unlinked,.k.nosrc{color:var(--bad)}
.git .foot{font-size:.9rem;border-top:1px dashed var(--line);padding-top:8px}
.git .foot.saved{color:var(--ok);font-weight:600}
.git .foot.wait{color:var(--muted)}
mark.vague{background:var(--vague-soft);color:var(--vague);border-bottom:2px dotted var(--vague);padding:0 3px;border-radius:3px}
.brain{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.brain .qline{display:flex;flex-wrap:wrap;gap:8px}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.groups>div{background:var(--info-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.groups b{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.word{border:2px solid var(--vague);background:var(--vague-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.word h3{color:var(--vague)}
.dispute{border-left:4px solid var(--ok);padding-left:12px;display:flex;flex-direction:column;gap:4px}
.fakebtn{align-self:flex-start;font-size:.85rem;font-weight:700;border:2px solid var(--line);border-radius:8px;padding:4px 12px;background:var(--card)}
.banner.tip{border-color:var(--accent);background:var(--accent-soft)}
.banner.tip b{color:var(--accent)}
.chip.sk{background:var(--card);border:2px solid var(--accent);color:var(--accent)}
.skills{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.skills li{background:var(--info-soft);border-radius:10px;padding:12px 14px}

/* presenter mode */
.cue{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.cue .cl{font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.cue .ct{font-size:1.65rem;line-height:1.45;font-weight:600}
.cue .pt{font-size:1.15rem;border-top:1px solid rgba(255,255,255,.35);padding-top:12px}
.cue .pt b{font-weight:700}
.modebtn{min-height:44px;padding:6px 14px;border:2px solid var(--accent);border-radius:10px;background:var(--card);color:var(--accent);font-weight:700;cursor:pointer;font-size:.9rem}
body:not(.pm) .cue{display:none}
.rd,.screen-label{display:none!important}
body.pm .src .cite{display:none}
body.pm .essay p{font-size:1.25rem}
body.pm .git li{font-size:1.05rem}
body.pm .box h3, body.pm .git h3{font-size:1.15rem}
body.pm .coach-box p{font-size:1.15rem}
.src .short{font-size:.95rem;font-weight:600}
.src details{display:flex;flex-direction:column;gap:10px}
.src summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem;min-height:32px}
.hint{font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.cue .ct{font-size:1.3rem}}

/* guided tour */
[hidden]{display:none!important}
#spot{position:fixed;z-index:4;border:3px solid #ffd23f;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,10,16,.62);pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s}
#tline{position:fixed;left:0;top:0;width:100%;height:100%;z-index:7;pointer-events:none}
#tline line{stroke:#ffd23f;stroke-width:3;stroke-linecap:round}
#tline circle{fill:#ffd23f;stroke:#1d2330;stroke-width:2}
#tcard{position:fixed;z-index:8;background:var(--card);color:var(--ink);border:3px solid #ffd23f;border-radius:14px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:8px}
#tcard .tn{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#tcard h3{font-size:1.1rem}
#tcard p{font-size:1.05rem;line-height:1.45}
#tcard .tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tcard .btn{min-height:40px;padding:6px 14px}
#tcard .skip{margin-left:auto;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;min-height:40px}
body.tour .cue{display:none}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;flex-direction:column;gap:8px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav .btn{min-width:130px}
.dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center}
.dot{width:25px;height:25px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;padding:0;font-size:.7rem;color:var(--muted)}
.dot[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.dot.done{background:var(--accent-soft);border-color:var(--accent)}
.dot.gap{margin-left:8px}
.count{text-align:center;font-size:.85rem;color:var(--muted)}
@media (max-width:520px){.nav .btn{min-width:96px;padding-inline:10px}.dots{display:none}}
@media (prefers-reduced-motion:no-preference){.fresh{animation:glow 1.6s ease-out 1}@keyframes glow{from{outline-color:transparent}to{outline-color:var(--accent)}}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand">The Writing Room<small>Nothing here is live. Use Next and Back.</small></div>
  <nav class="pills" aria-label="Jump to a student" id="pills"></nav>
  <button class="modebtn" id="mode" hidden></button>
</div></header>

<div class="wrap"><main id="stage" tabindex="-1" aria-live="polite"></main></div>

<footer class="bar"><div class="wrap">
  <div class="nav">
    <button class="btn ghost" id="prev">← Previous</button>
    <div class="dots" id="dots" role="group" aria-label="Steps"></div>
    <button class="btn" id="next">Next →</button>
  </div>
  <div class="count" id="count"></div>
</div></footer>

<div id="tour" hidden>
  <div id="spot"></div>
  <svg id="tline" aria-hidden="true"><line x1="0" y1="0" x2="0" y2="0"></line><circle r="7" cx="0" cy="0"></circle></svg>
  <div id="tcard" role="dialog" aria-live="polite" aria-label="Guided tip">
    <span class="tn" id="tn"></span><h3 id="tt"></h3><p id="tx"></p>
    <div class="tb"><button class="btn ghost" id="tback">← Back</button><button class="btn" id="tnext">Next →</button><button class="skip" id="tskip">Hide tips</button></div>
  </div>
</div>
<script>
/* ---------- sources: quotes copied from the real papers (see sources-verified.md) ---------- */
var SRC = [
  {id:'S1', role:'Supports the idea',
   cite:'Bloom, Liang, Roberts & Ying (2013). Does Working from Home Work? Evidence from a Chinese Experiment. NBER Working Paper 18871.',
   quotes:['“Home working led to a 13% performance increase, of which about 9% was from working more minutes per shift (fewer breaks and sick-days) and 4% from more calls per minute (attributed to a quieter working environment).”'],
   method:'How it was done: one company (CTrip, a travel agency). Call-centre staff who volunteered were randomly assigned to work from home or in the office for 9 months. 249 employees took part.'},
  {id:'S2', role:'Complicates the idea',
   cite:'Gibbs, Mengel & Siemroth (May 2021). Work from Home & Productivity: Evidence from Personnel & Analytics Data on IT Professionals. IZA Discussion Paper 14336.',
   quotes:['“Total hours worked increased by roughly 30%, including a rise of 18% in working after normal business hours.”',
           '“Average output did not significantly change. Therefore, productivity fell by about 20%.”',
           '“Employees also spent less time networking, and received less coaching and 1:1 meetings with supervisors.”'],
   method:'How it was done: one company (a large Asian IT services firm), over 10,000 skilled professionals, compared before and during the Covid-19 work-from-home period.'},
  {id:'S3', role:'A nearby question: who gets feedback?',
   cite:'Emanuel, Harrington & Pallais. The Power of Proximity to Coworkers. NBER Working Paper 31880 (June 2026 revision).',
   quotes:['“We find that sitting near teammates increases coding feedback by 18.3% and improves code quality.”',
           '“Gains are concentrated among less-tenured and younger employees, who are building human capital.”',
           '“However, there is a tradeoff: experienced engineers write less code when sitting near teammates.”'],
   method:'How it was done: software engineers at one Fortune 500 firm, 2019 to 2024, around the 2020 office closures and the later return-to-office rules.'}
];
var BADGE = {
  used:function(p){return '<span class="badge used">✓ Used in '+p+'</span>'},
  open:function(){return '<span class="badge open">○ Not used yet</span>'},
  gap:function(){return '<span class="badge gap">⚠ Not addressed yet</span>'},
  aside:function(){return '<span class="badge aside">⤵ Set aside</span>'}
};

/* ---------- commits per case (shown from step "at" onward) ---------- */
var COMMITS = {
 1:[{at:4,h:'101a',m:'First claim, backed by Bloom (S1). Kept my doubt about new staff for Paragraph 2.'},
    {at:5,h:'102b',m:'Gibbs pushes back. My view now: the gain depends on the kind of work.'},
    {at:6,h:'103c',m:'Cut a vague phrase. Now I say who gains and who pays. Kept “quietly” on purpose.'},
    {at:7,h:'104d',m:'Added a new hire’s side, and the feedback study (S3).'},
    {at:9,h:'105e',m:'Undid the paste. Edited the flagged words instead and kept my S2 link.'}],
 2:[{at:1,h:'201a',m:'(no reason written)'},
    {at:2,h:'202b',m:'Added the Gibbs finding to Paragraph 2.'},
    {at:3,h:'203c',m:'Narrowed Paragraph 1 so it only claims what Bloom studied.'},
    {at:4,h:'204d',m:'Rewrote the conclusion using the feedback study.'},
    {at:5,h:'205e',m:'Final version.'}],
 3:[{at:1,h:'301a',m:'Built the thesis on Bloom: remote work raises performance by 13%.'},
    {at:2,h:'302b',m:'Set aside Gibbs. It studies one company only.'},
    {at:3,h:'303c',m:'Concluded that AI chat tools replace in-person feedback.'}]
};

/* ---------- the four skills ---------- */
var SK = {R:'📖 Reading',L:'⚖️ Logic',W:'✍️ Writing',C:'🗣️ Communication'};

/* final Student 1 paragraphs, reused across steps */
var P1 = 'Working from home can raise output: call-centre volunteers at one company performed 13% better [S1].';
var P2a = 'But at one large IT firm, hours rose by roughly 30% while output did not significantly change, and staff got less coaching [S2]. So the gain may depend on the kind of work.';
var P2b = 'But at one large IT firm, hours rose by roughly 30% while output did not significantly change, and staff got less coaching [S2]. So the gain may depend on whether the job is routine or built on teamwork.';
var P3 = 'Overall, remote work helps experienced staff in routine jobs, and may quietly cost newer staff the coaching they need.';
var P4 = 'A new hire may still prefer home: no commute and more control over the day. But sitting near teammates raised coding feedback by 18.3%, mostly for less-tenured engineers [S3]. So the answer may be some days together, not a full return.';

/* ---------- the story ---------- */
var FR = [];
FR.push({type:'intro'});

/* Case 1: one honest student, from one idea to a defended essay */
FR.push({c:1,n:1,title:'It starts with one rough idea',
 plain:'This student has not read anything yet. They type one line: their first guess. Nothing is graded here. The box at the top right is the “git status”: like in a software team, it lists what changed since the last saved snapshot.',
 look:['The essay is one short sentence. That is a fine start.','git status says there is 1 change that is not saved yet.','The three real research papers are on the left, closed off as “Not used yet”.'],
 sk:[], src:['open','open','open'],
 git:{ch:[['new','¶1','“Remote work is good. No commute.” (6 words)']]},
 paras:['Remote work is good. No commute.',null,null], fresh:[0],
 coach:'Nice start. Want to brainstorm before you write more? I will ask three short questions. You answer in your own words.'});

FR.push({c:1,n:2,title:'Brainstorm: the Coach asks, the student answers',
 plain:'The Coach asks three short questions. The student types quick bullet points, in their own rough words. Then the Helper sorts those bullets into groups. It does not add or change a single word. This trains logic: seeing what you think, and what you still need to find out.',
 look:['The three Coach questions are at the top of the board.','Every bullet is the student’s own words. The Helper only moved them into groups.','One group is “Doubts”. That doubt becomes Paragraph 2 later.'],
 sk:['L'], src:['open','open','open'],
 brain:{qs:['Good for who?','Good how? What gets better?','Says who? What would show it?'],
  groups:[{name:'Gains',items:['save time travelling','easier to focus at home?']},
          {name:'Doubts',items:['bosses worry people slack off','new people learn by watching others']},
          {name:'Need evidence',items:['numbers on output, not just feelings']}]},
 git:{ch:[['new','¶1','“Remote work is good. No commute.”'],['new','brainstorm','5 bullet points in 3 groups']]},
 paras:['Remote work is good. No commute.',null,null], fresh:[],
 coach:'Your bullets are grouped. Which group would you look into first?'});

FR.push({c:1,n:3,title:'Read: link a claim to a real sentence',
 plain:'The student opens the first paper and links their claim to one passage. Then they read the method note under it: one company, call-centre volunteers. So they make the claim smaller, to match what was really studied. This trains reading: what a study shows, and what it does not.',
 look:['“Used in Paragraph 1” shows on the first paper.','Paragraph 1 now says “call-centre volunteers at one company”. That came from the method note.','The doubt from the brainstorm is now Paragraph 2, still as a question.'],
 sk:['R'], src:['used:Paragraph 1','open','open'],

FR.push({c:1,n:7,title:'See the other side',
 plain:'So far the essay looks at the company. The Coach asks: what would a new hire say? They save a commute and control their day. The student adds that view, then uses the third paper to answer it. Their conclusion becomes fairer and more realistic. This trains communication: writing for people who see it differently.',
 look:['Paragraph 4 is new. It starts from the new hire’s point of view.','The third paper is now used, so all three are linked.','The suggestion “some days together” is the student’s own idea.'],

 coach:'Your essay looks at the company. What would a new hire who saves a long commute say?'});

function tourPlace(doScroll){
  var L = tourListFor(cur), T = $('#tour');

  var topH = $('.top').offsetHeight, barH = $('.bar').offsetHeight, vw = document.documentElement.clientWidth, vh = window.innerHeight;

  var sp = $('#spot'); sp.style.left=(r.left-8)+'px'; sp.style.top=(r.top-8)+'px'; sp.style.width=(r.width+16)+'px'; sp.style.height=(r.height+16)+'px';

  var pos = null, cands = [
    function(){var t=r.bottom+gap; return t+ch<=hi ? [cl(r.left+r.width/2-cw/2,16,vw-cw-16), t] : null},
    function(){var t=r.top-gap-ch; return t>=lo ? [cl(r.left+r.width/2-cw/2,16,vw-cw-16), t] : null},
    function(){var l=r.right+gap; return l+cw<=vw-16 ? [l, cl(r.top,lo,hi-ch)] : null},
    function(){var l=r.left-gap-cw; return l>=16 ? [l, cl(r.top,lo,hi-ch)] : null}

  for(var k=0;k<cands.length && !pos;k++) pos = cands[k]();

  var line = $('#tline line'), dot = $('#tline circle');
