name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    env:
      ROOM_LLM: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Locked, hash-checked dependencies (D-040). To regenerate, see prototype/README.md.
      - run: pip install --require-hashes -r prototype/requirements.lock
      - name: prototype tests
        run: cd prototype && ROOM_LLM=stub python -m pytest -q
      - name: kit tests (29)
        run: cd writing-room-kit && ROOM_LLM=stub python -m pytest -q v04/tests web/tests
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  golden:
    runs-on: ubuntu-latest
    env:
      ROOM_LLM: stub
      GOLDEN_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/web/package-lock.json
      - run: pip install --require-hashes -r prototype/requirements.lock
      - run: npm ci
        working-directory: prototype/web
      - name: install pinned Chromium
        run: npx --no-install playwright-core install --with-deps chromium
        working-directory: prototype/web
      - name: regenerate browser recordings
        run: node golden/record.mjs
        working-directory: prototype/web
      - name: recordings match the committed fixtures
        run: git diff --exit-code -- prototype/fixtures/golden/recorded
      - name: receipts from regenerated recordings match frozen expectations
        run: python -m pytest -q server/tests/test_golden_sessions.py
        working-directory: prototype
